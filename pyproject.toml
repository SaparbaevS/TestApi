[project]
name = "microtest"
version = "0.1.0"
description = ""
authors = [
    {name = "Sultan",email = "saparbaevsultan17@gmail.com"}
]
license = "MIT"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn[standard] (>=0.44.0,<0.45.0)",
    "pydantic[email] (>=2.13.0,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "fastapi-users[sqlalchemy] (>=15.0.5,<16.0.0)",
    "sqladmin[full] (>=0.25.0,<0.26.0)",
    "fastapi-cache2 (>=0.2.2,<0.3.0)",
    "redis (>=7.4.0,<8.0.0)"
]
[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "black (>=26.3.1,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
